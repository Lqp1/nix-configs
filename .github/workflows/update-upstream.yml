name: Update Upstream Flakes
on:
  schedule:
    - cron: '0 4 * * 5' # Every Friday at 4:00 AM
  workflow_dispatch:

jobs:
  update-upstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        input: [nixpkgs, nixpkgs-unstable, nix-darwin, home-manager, nixos-hardware, flake-utils]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update input and generate diff
        run: |
          cp flake.lock flake.lock.before
          nix flake lock --update-input ${{ matrix.input }}

          if ! git diff --quiet flake.lock; then
            cp flake.lock flake.lock.after

            cp flake.lock.before flake.lock
            OLD_DRV=$(nix eval --raw "path:$PWD#nixosConfigurations.test-vm.config.system.build.toplevel.drvPath")

            cp flake.lock.after flake.lock
            NEW_DRV=$(nix eval --raw "path:$PWD#nixosConfigurations.test-vm.config.system.build.toplevel.drvPath")

            nix shell --inputs-from "path:$PWD" nixpkgs#nvd nixpkgs#nix-diff -c bash -c '
              nvd --color never diff "$1" "$2" > nvd_output.txt || true
              if [ "$1" != "$2" ]; then
                nix-diff --color never --line-oriented "$1" "$2" > nix_diff_output.txt || true
              fi
            ' _ "$OLD_DRV" "$NEW_DRV"
          fi
          rm -f flake.lock.before flake.lock.after
          
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet flake.lock; then
            BRANCH_NAME="chore/update-upstream-${{ matrix.input }}"
            
            git checkout -b "$BRANCH_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git add flake.lock
            git commit -m "chore(flake): update upstream input ${{ matrix.input }}"
            git push --force origin "$BRANCH_NAME"
            
            # Prepare PR Body
            {
              echo "Automated update of upstream flake input: \`${{ matrix.input }}\`"
              echo ""
              if [ -s nvd_output.txt ]; then
                echo "<details>"
                echo "<summary>Package Diff (nvd)</summary>"
                echo ""
                echo '`````text'
                cat nvd_output.txt
                echo '`````'
                echo ""
                echo "</details>"
                echo ""
              fi
              if [ -s nix_diff_output.txt ]; then
                echo "<details>"
                echo "<summary>Derivation Diff (nix-diff)</summary>"
                echo ""
                echo '`````diff'
                head -c 50000 nix_diff_output.txt
                if [ "$(wc -c < nix_diff_output.txt)" -gt 50000 ]; then
                  echo ""
                  echo "... (truncated)"
                fi
                echo '`````'
                echo ""
                echo "</details>"
              fi
            } > pr-body.txt

            gh pr create \
              --title "chore(flake): update ${{ matrix.input }}" \
              --body-file pr-body.txt \
              --head "$BRANCH_NAME" \
              --base main || gh pr edit "$BRANCH_NAME" --body-file pr-body.txt || true
          else
            echo "No changes to flake.lock for ${{ matrix.input }}"
          fi
